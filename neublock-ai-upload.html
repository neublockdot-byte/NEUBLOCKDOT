<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEUBLOCK · AI Auto Upload (Gemini)</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2300E5FF'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='18' font-family='sans-serif' font-weight='900' fill='%23000'%3EN%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #050712;
            --surface: #0f1220;
            --card: #141a2a;
            --card2: #16212f;
            --border: rgba(34,150,206,0.4);
            --bdim: rgba(34,150,206,0.15);
            --cyan: #22d1ff;
            --blue: #4ea8ff;
            --green: #2dd5a6;
            --red: #f7768e;
            --text: #e5f1ff;
            --muted: #91a8c0;
            --r: 16px;
            --t: all 0.22s ease;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 2rem 1rem;
            min-height: 100vh;
        }
        .container {
            max-width: 860px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--cyan);
            letter-spacing: -0.03em;
        }
        .sub {
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 0.3rem;
        }
        .card {
            background: linear-gradient(135deg, var(--card), var(--card2));
            border: 1.5px solid var(--border);
            border-radius: var(--r);
            padding: 1.8rem;
            margin-bottom: 1.5rem;
        }
        .card-title {
            font-size: 1rem;
            font-weight: 800;
            color: var(--cyan);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 600px) {
            .row {
                grid-template-columns: 1fr;
            }
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .field.full {
            grid-column: 1/-1;
        }
        label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        input, select, textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(34,209,255,0.04);
            border: 1.5px solid var(--bdim);
            border-radius: 12px;
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            transition: var(--t);
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(34,209,255,0.1);
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        .type-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.6rem;
            margin-bottom: 1.2rem;
        }
        @media (max-width: 500px) {
            .type-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        .type-btn {
            padding: 0.7rem 0.5rem;
            border-radius: 12px;
            border: 1.5px solid var(--bdim);
            background: rgba(34,209,255,0.03);
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--t);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            font-family: inherit;
        }
        .type-btn i {
            font-size: 1.1rem;
        }
        .type-btn.active {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34,209,255,0.1);
        }
        .prompt-area {
            position: relative;
        }
        .mic-btn {
            position: absolute;
            bottom: 0.8rem;
            right: 0.8rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(34,209,255,0.1);
            border: 1.5px solid var(--border);
            color: var(--cyan);
            cursor: pointer;
            transition: var(--t);
        }
        .mic-btn.recording {
            background: rgba(247,118,142,0.2);
            border-color: var(--red);
            color: var(--red);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .btn-gen {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--cyan), #00b8d4);
            color: #000;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: var(--t);
        }
        .btn-gen:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(34,209,255,0.4);
        }
        .btn-gen:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .preview-box {
            background: rgba(0,0,0,0.3);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 1.2rem;
            font-size: 0.82rem;
            font-family: 'Courier New', monospace;
            color: #a8d8ea;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
            line-height: 1.6;
        }
        .preview-actions {
            display: flex;
            gap: 0.7rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .btn-upload {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, var(--green), #1ab394);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-regen {
            padding: 0.75rem 1.2rem;
            background: transparent;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            color: var(--muted);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-regen:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 9999;
            padding: 0.9rem 1.4rem;
            border-radius: 14px;
            font-size: 0.88rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            animation: fadeIn 0.3s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .toast.success {
            background: rgba(45,213,166,0.15);
            border: 1.5px solid var(--green);
            color: var(--green);
        }
        .toast.error {
            background: rgba(247,118,142,0.15);
            border: 1.5px solid var(--red);
            color: var(--red);
        }
        .toast.info {
            background: rgba(34,209,255,0.15);
            border: 1.5px solid var(--cyan);
            color: var(--cyan);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .status-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1rem;
            background: rgba(34,209,255,0.05);
            border: 1px solid var(--bdim);
            border-radius: 10px;
            font-size: 0.82rem;
            margin-bottom: 1rem;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
        }
        .hidden {
            display: none;
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .chips {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.6rem;
        }
        .chip {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            background: rgba(34,209,255,0.07);
            border: 1px solid var(--bdim);
            color: var(--muted);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }
        .chip:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }
        .tip {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 0.4rem;
            display: flex;
            gap: 0.3rem;
        }
        .history-item {
            background: rgba(34,209,255,0.03);
            border: 1px solid var(--bdim);
            border-radius: 10px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.83rem;
        }
        .history-badge {
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
        }
        .badge-project { background: rgba(78,168,255,0.15); color: var(--blue); }
        .badge-component { background: rgba(34,209,255,0.15); color: var(--cyan); }
        .badge-circuit { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .badge-course { background: rgba(45,213,166,0.15); color: var(--green); }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">⚡ NEUBLOCK AI Upload</div>
        <div class="sub">Gemini API → Structured JSON → Supabase</div>
    </div>

    <!-- API Keys Card -->
    <div class="card">
        <div class="card-title"><i class="fas fa-key"></i> 1. API Credentials</div>
        <div class="row">
            <div class="field">
                <label>Gemini API Key (Free)</label>
                <input type="password" id="geminiKey" placeholder="AIzaSy..." autocomplete="off">
                <div class="tip"><i class="fas fa-info-circle"></i> Get from <a href="https://aistudio.google.com/" target="_blank" style="color:var(--cyan)">Google AI Studio</a></div>
            </div>
            <div class="field">
                <label>Supabase URL</label>
                <input type="text" id="sbUrl" value="https://dqjzvembtenfhtgpttie.supabase.co" readonly>
            </div>
            <div class="field">
                <label>Supabase Anon Key</label>
                <input type="password" id="sbKey" value="sb_publishable_LldCCFUKJShZ3ItHs5Uagw_yzIFflqd" readonly>
            </div>
        </div>
    </div>

    <!-- Generation Card -->
    <div class="card">
        <div class="card-title"><i class="fas fa-magic"></i> 2. Describe what you want to create</div>
        <div class="type-grid" id="typeGrid">
            <button class="type-btn active" data-type="project"><i class="fas fa-robot"></i> Project</button>
            <button class="type-btn" data-type="component"><i class="fas fa-microchip"></i> Component</button>
            <button class="type-btn" data-type="circuit"><i class="fas fa-project-diagram"></i> Circuit</button>
            <button class="type-btn" data-type="course"><i class="fas fa-graduation-cap"></i> Course</button>
        </div>
        <div class="field full">
            <label>Your description (English preferred, simple)</label>
            <div class="prompt-area">
                <textarea id="userPrompt" placeholder="e.g., Create a line-following robot project using Arduino Uno, two IR sensors, L298N motor driver, and 12V battery. Include GitHub link and build steps."></textarea>
                <button class="mic-btn" id="micBtn" title="Speech input"><i class="fas fa-microphone"></i></button>
            </div>
            <div class="chips" id="exampleChips"></div>
        </div>
        <button class="btn-gen" id="genBtn"><i class="fas fa-sparkles"></i> Generate JSON with Gemini</button>
    </div>

    <!-- Preview & Upload Card (hidden initially) -->
    <div class="card hidden" id="previewCard">
        <div class="card-title"><i class="fas fa-eye"></i> 3. Preview & Upload</div>
        <div class="status-bar" id="statusBar">
            <div class="status-dot"></div>
            <span>Generated data ready. Check before uploading.</span>
        </div>
        <div class="preview-box" id="previewJson"></div>
        <div class="preview-actions">
            <button class="btn-upload" id="uploadBtn"><i class="fas fa-cloud-upload-alt"></i> Upload to Supabase</button>
            <button class="btn-regen" id="regenBtn"><i class="fas fa-redo"></i> Regenerate</button>
            <button class="btn-regen" id="closePreviewBtn"><i class="fas fa-times"></i> Close</button>
        </div>
    </div>

    <!-- History Card -->
    <div class="card">
        <div class="card-title"><i class="fas fa-history"></i> Recent Uploads</div>
        <div id="historyList">
            <div style="color:var(--muted); text-align:center; padding:1rem;">No uploads yet</div>
        </div>
    </div>
</div>

<script>
    // ======================= CONFIGURATION =======================
    const TABLE_MAP = {
        project: 'projects',
        component: 'components',
        circuit: 'circuits',
        course: 'courses'
    };

    // JSON schemas for each type (exactly matches your DB columns)
    const SCHEMAS = {
        project: `{
  "title": "string (required)",
  "icon": "fa-robot",
  "description": "detailed description",
  "tech": ["Arduino", "Python"],
  "github": "https://... or null",
  "link": "https://... or null",
  "video": "https://youtube.com/... or null",
  "images": [],
  "code_files": [],
  "components": [{"name":"LED","description":"Red LED"}],
  "build_steps": ["Step 1 description"],
  "videos": []
}`,
        component: `{
  "name": "string (required)",
  "category": "sensor|actuator|module|display|power|communication|passive",
  "description": "detailed description",
  "image": null,
  "tags": ["tag1","tag2"]
}`,
        circuit: `{
  "name": "string (required)",
  "description": "detailed description",
  "image": null,
  "difficulty": "Beginner|Intermediate|Advanced",
  "components_used": ["Arduino Uno","LED","Resistor"]
}`,
        course: `{
  "title": "string (required)",
  "description": "detailed description",
  "category": "arduino|robotics|ai|python",
  "level": "Beginner|Intermediate|Advanced",
  "is_free": true,
  "price": 0,
  "thumbnail": null,
  "lessons": [{"title":"Lesson 1","description":"What you'll learn"}]
}`
    };

    // Example prompts per type
    const EXAMPLES = {
        project: [
            "Line Following Robot using Arduino with IR sensors",
            "Voice controlled robot using ESP32 and Bluetooth",
            "Weather station with DHT11 and LCD display"
        ],
        component: [
            "HC-SR04 Ultrasonic Distance Sensor, range 2-400cm, 5V",
            "L298N Motor Driver Module, dual H-bridge",
            "DHT11 Temperature & Humidity Sensor"
        ],
        circuit: [
            "LED Blink circuit with 220 ohm resistor on Arduino pin 13",
            "Motor control circuit using L298N and DC motor",
            "Temperature sensor circuit with LCD display"
        ],
        course: [
            "Arduino Basics for Beginners - 10 lessons, free",
            "Robotics fundamentals course, intermediate level",
            "ESP32 IoT course with 8 practical projects"
        ]
    };

    // ======================= STATE =======================
    let currentType = 'project';
    let generatedData = null;
    let recognition = null;
    let isRecording = false;
    let history = JSON.parse(localStorage.getItem('nb_ai_history') || '[]');

    // ======================= DOM ELEMENTS =======================
    const geminiKeyInput = document.getElementById('geminiKey');
    const sbUrlInput = document.getElementById('sbUrl');
    const sbKeyInput = document.getElementById('sbKey');
    const userPrompt = document.getElementById('userPrompt');
    const genBtn = document.getElementById('genBtn');
    const previewCard = document.getElementById('previewCard');
    const previewJson = document.getElementById('previewJson');
    const uploadBtn = document.getElementById('uploadBtn');
    const regenBtn = document.getElementById('regenBtn');
    const closePreviewBtn = document.getElementById('closePreviewBtn');
    const historyDiv = document.getElementById('historyList');
    const micBtn = document.getElementById('micBtn');
    const exampleChips = document.getElementById('exampleChips');

    // ======================= UTILITIES =======================
    function showToast(msg, type = 'info') {
        const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<i class="fas ${icons[type]}"></i> ${msg}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }

    function saveApiKey() {
        const key = geminiKeyInput.value.trim();
        if (key) localStorage.setItem('nb_gemini_key', key);
    }
    function loadApiKey() {
        const saved = localStorage.getItem('nb_gemini_key');
        if (saved) geminiKeyInput.value = saved;
    }
    loadApiKey();
    geminiKeyInput.addEventListener('change', saveApiKey);

    function getSupabase() {
        const url = sbUrlInput.value.trim();
        const key = sbKeyInput.value.trim();
        if (!url || !key) {
            showToast('Supabase URL or Anon Key missing', 'error');
            return null;
        }
        return window.supabase.createClient(url, key);
    }

    // ======================= TYPE SELECTION =======================
    document.querySelectorAll('.type-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentType = btn.dataset.type;
            updateExampleChips();
            userPrompt.placeholder = `Describe your ${currentType} in simple English...`;
        });
    });

    function updateExampleChips() {
        const examples = EXAMPLES[currentType] || [];
        exampleChips.innerHTML = examples.map(ex => `<div class="chip" data-example="${ex.replace(/"/g, '&quot;')}">💡 ${ex}</div>`).join('');
        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', () => {
                userPrompt.value = chip.dataset.example;
            });
        });
    }
    updateExampleChips();

    // ======================= GEMINI API CALL =======================
    async function generateJSON() {
        const apiKey = geminiKeyInput.value.trim();
        const prompt = userPrompt.value.trim();

        if (!apiKey) {
            showToast('Please enter your Gemini API Key', 'error');
            return null;
        }
        if (!prompt) {
            showToast('Please describe what you want to create', 'error');
            return null;
        }

        const systemPrompt = `You are a JSON generator for NEUBLOCK robotics database.
The user will describe a ${currentType} in English.
Return ONLY valid JSON (no markdown, no extra text) matching this schema:
${SCHEMAS[currentType]}
Make descriptions detailed and educational. Use null for optional missing fields.
Do NOT wrap the JSON in backticks or markdown.`;

        genBtn.disabled = true;
        genBtn.innerHTML = '<i class="fas fa-spinner spinner"></i> Contacting Gemini...';

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: systemPrompt + '\n\nUser: ' + prompt }] }],
                    generationConfig: { temperature: 0.7, maxOutputTokens: 1500 }
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || `HTTP ${response.status}`);
            }

            const data = await response.json();
            let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
            // Clean markdown fences
            rawText = rawText.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
            const parsed = JSON.parse(rawText);
            return parsed;
        } catch (err) {
            showToast(`Gemini error: ${err.message}`, 'error');
            console.error(err);
            return null;
        } finally {
            genBtn.disabled = false;
            genBtn.innerHTML = '<i class="fas fa-sparkles"></i> Generate JSON with Gemini';
        }
    }

    // ======================= UPLOAD TO SUPABASE =======================
    async function uploadToSupabase(data) {
        const sb = getSupabase();
        if (!sb) return false;
        const table = TABLE_MAP[currentType];
        if (!table) {
            showToast('Invalid table type', 'error');
            return false;
        }

        uploadBtn.disabled = true;
        uploadBtn.innerHTML = '<i class="fas fa-spinner spinner"></i> Uploading...';

        try {
            const { error } = await sb.from(table).insert(data).select();
            if (error) throw new Error(error.message);
            showToast(`✅ Successfully uploaded to ${table}`, 'success');
            // Save to history
            const title = data.title || data.name || 'Untitled';
            addToHistory(currentType, title);
            return true;
        } catch (err) {
            showToast(`Upload failed: ${err.message}`, 'error');
            console.error(err);
            return false;
        } finally {
            uploadBtn.disabled = false;
            uploadBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Upload to Supabase';
        }
    }

    // ======================= HISTORY (localStorage) =======================
    function addToHistory(type, title) {
        history.unshift({ type, title, time: new Date().toLocaleString() });
        if (history.length > 20) history.pop();
        localStorage.setItem('nb_ai_history', JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        if (!history.length) {
            historyDiv.innerHTML = '<div style="color:var(--muted); text-align:center; padding:1rem;">No uploads yet</div>';
            return;
        }
        historyDiv.innerHTML = history.map(h => `
            <div class="history-item">
                <span class="history-badge badge-${h.type}">${h.type}</span>
                <span class="history-title">${escapeHtml(h.title)}</span>
                <span class="history-time">${h.time}</span>
            </div>
        `).join('');
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ======================= VOICE INPUT =======================
    function initVoice() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            micBtn.style.display = 'none';
            return;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.continuous = false;

        micBtn.addEventListener('click', () => {
            if (isRecording) {
                recognition.stop();
                return;
            }
            recognition.start();
            micBtn.classList.add('recording');
            micBtn.innerHTML = '<i class="fas fa-stop"></i>';
            isRecording = true;
        });

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            userPrompt.value += (userPrompt.value ? ' ' : '') + transcript;
        };
        recognition.onend = () => {
            micBtn.classList.remove('recording');
            micBtn.innerHTML = '<i class="fas fa-microphone"></i>';
            isRecording = false;
        };
        recognition.onerror = (e) => {
            showToast(`Voice error: ${e.error}`, 'error');
            micBtn.classList.remove('recording');
            micBtn.innerHTML = '<i class="fas fa-microphone"></i>';
            isRecording = false;
        };
    }
    initVoice();

    // ======================= MAIN FLOW =======================
    async function generateAndShow() {
        const data = await generateJSON();
        if (!data) return;
        generatedData = data;
        previewJson.textContent = JSON.stringify(data, null, 2);
        previewCard.classList.remove('hidden');
        previewCard.scrollIntoView({ behavior: 'smooth' });
        showToast('JSON generated successfully. Review and upload.', 'success');
    }

    async function handleUpload() {
        if (!generatedData) {
            showToast('No data to upload. Generate first.', 'error');
            return;
        }
        await uploadToSupabase(generatedData);
        // Optionally clear preview after success
        if (confirm('Upload complete. Clear preview?')) {
            previewCard.classList.add('hidden');
            generatedData = null;
            userPrompt.value = '';
        }
    }

    genBtn.addEventListener('click', generateAndShow);
    uploadBtn.addEventListener('click', handleUpload);
    regenBtn.addEventListener('click', generateAndShow);
    closePreviewBtn.addEventListener('click', () => {
        previewCard.classList.add('hidden');
        generatedData = null;
    });

    renderHistory();
</script>
</body>
</html>
